# @meitogi/signal relay backend for HAProxy ≥ 2.4. Load it next to your config :
#   haproxy -f haproxy.cfg -f signal-relay.cfg
# with RELAY_DOMAIN in HAProxy's environment, then add to your HTTPS frontend :
#   use_backend signal_relay if { req.hdr(host),field(1,:) -i "${RELAY_DOMAIN}" }

backend signal_relay
    mode http
    option httpchk GET /healthz
    # The relay reads the client's IP from X-Forwarded-For when TRUST_PROXY covers HAProxy.
    option forwardfor
    # A WebSocket is a tunnel once upgraded : `timeout tunnel` replaces client/server
    # timeouts. The relay pings every 30 s, so an hour only bounds a dead peer.
    timeout tunnel 1h
    timeout client-fin 10s
    timeout server 30s
    timeout connect 5s
    server relay signal-relay:8787 check
