# @meitogi/signal relay behind an existing Caddy : the relay joins Caddy's network as `signal-relay`,
# and your Caddyfile imports relay.caddy (with RELAY_DOMAIN in Caddy's environment).
#   docker compose --env-file ../.env -p signal-relay up -d --build
services:
  signal-relay:
    build: ../..
    image: signal-relay
    restart: unless-stopped
    environment:
      RELAY_KEY: ${RELAY_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      RELAY_LEGACY: ${RELAY_LEGACY:-0}
    networks: [proxy]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
