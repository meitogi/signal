# Test-only main config : stands for the user's own. The HTTPS frontend carries the one
# line signal-relay.cfg asks for. The image runs HAProxy unprivileged, hence :8443.
global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend https
    bind :8443 ssl crt /certs/relay.pem
    use_backend signal_relay if { req.hdr(host),field(1,:) -i "${RELAY_DOMAIN}" }
